# =============================================================================
# DevSkyy Production CI/CD Pipeline
# =============================================================================
# Comprehensive testing, security scanning, and deployment pipeline
# Supports: Python backend, Next.js frontend, Three.js, Playwright e2e
#
# Lint and tests run in parallel for fast feedback.
# Deployment jobs gate on both lint and tests passing.
# Security gates block deployment on critical vulnerabilities.
# =============================================================================

name: DevSkyy CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly security scan on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Skip Playwright e2e tests"
        required: false
        default: false
        type: boolean
      force_deploy:
        description: "Force deployment (skip some checks)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Black validates AST equivalence against pyproject.toml's py313 target.
  # Keep the CI interpreter aligned with that target.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A new push to a PR cancels that PR's stale run. Pushes to main get one group
# per commit and are never cancelled, so every merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # Stage 0: Change detection (pull requests only)
  # ===========================================================================
  # Path-filtered jobs skip on a PR whose files cannot affect them; a job skipped
  # by `if:` reports "skipped", which satisfies its required check. Every filtered
  # job also runs when this detector did not succeed, so it fails closed.
  changes:
    name: 🧭 Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      theme: ${{ steps.filter.outputs.theme }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          # app: frontend build + Playwright (which boots the Python backend).
          # Everything counts except paths neither of them reads.
          # theme: the WordPress Theme job reads only wordpress-theme/.
          filters: |
            app:
              - '**'
              - '.github/**'
              - '!**/*.md'
              - '!docs/**'
              - '!tasks/**'
              - '!.planning/**'
              - '!.wolf/**'
              - '!.claude/**'
              - '!**/*.php'
              - '!wordpress-theme/skyyrose-flagship-2/**'
            theme:
              - 'wordpress-theme/**'
              - 'logo-registry.json'
              - '.github/**'

  # ===========================================================================
  # Stage 1: Lint & Static Analysis (Fast Feedback)
  # ===========================================================================
  lint:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-lint.txt

      - name: Reject retired brand copy
        run: python scripts/check_retired_brand_copy.py

      # Exact versions live in requirements-lint.txt (tests/ci pins the shape).
      - name: Install linting tools
        run: pip install -r requirements-lint.txt

      - name: Run ruff (fast linter)
        run: ruff check . --output-format=github

      - name: Check black formatting
        run: black --check --diff .

      - name: Check isort imports
        run: isort --check-only --diff .

      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: Run mypy type checking
        run: mypy . --ignore-missing-imports --no-error-summary

  # ===========================================================================
  # Stage 2: Python Backend Tests
  # ===========================================================================
  python-tests:
    name: 🐍 Python Tests
    # Hosted Linux provides Docker for Redis without depending on an absent
    # docker-arm64 runner. Preserve the complete suite and service container.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        # ECR Public mirror of the official image (same digest) — avoids Docker Hub anonymous pull limits on shared runners.
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Optional deps the suite imports (langgraph comes from the [mcp] extra with a
      # compatible pin; the rest are standalone). Nothing is masked: an extra or
      # package that fails to install fails the job.
      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: dev,mcp,higgsfield
          packages: pytest pytest-asyncio pytest-cov pytest-xdist httpx boto3 scikit-image trimesh pyotp

      # tests/test_buglog_published_ids.py compares this tree's bug ids against
      # what main has published. actions/checkout fetches only the ref under test
      # at depth 1, so origin/main is absent and that gate would skip silently;
      # it raises in CI instead, and this is what keeps it able to run.
      # A push to main IS the published state: pin origin/main to the commit under
      # test, because a later merge's new ids would otherwise falsely fail it.
      # Elsewhere compare with main's tip; `+` because a shallow fetch cannot prove
      # a fast-forward once main moves mid-run (main run 38147299555, 2026-10-11).
      - name: Fetch origin/main for published-id comparison
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            git update-ref refs/remotes/origin/main "$GITHUB_SHA"
          else
            git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
          fi

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=pytest-results.xml \
            -n auto \
            --ignore=tests/e2e
        env:
          PYTHONPATH: ${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          MINIMUM_FIDELITY_SCORE: "95.0"

      - name: Upload coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov --verbose upload-process \
            --fail-on-error=false \
            -t "$CODECOV_TOKEN" \
            -f coverage.xml \
            -F python || true

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-test-results
          path: |
            pytest-results.xml
            htmlcov/
          retention-days: 7

  # ===========================================================================
  # Stage 2: Security Scanning (Parallel with Tests)
  # ===========================================================================
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: dev
          packages: pip-audit bandit safety

      - name: Install semgrep
        # semgrep wheel build fails on Python 3.12 from source; use pipx isolation.
        # semgrep is informational, so a failed install skips it (see the gate below).
        run: pipx install semgrep || pip install semgrep || true

      - name: Run pip-audit (dependency vulnerabilities)
        id: pip_audit
        run: |
          pip_audit_status=0
          # Targeted ignores: CVEs with NO fixed release in any version (cannot be
          # bumped away). Documented + revisited when upstreams publish a fix.
          #   chromadb     CVE-2026-45829   (no patched release)
          #   torch        PYSEC-2026-139, CVE-2025-3000   (no patched release)
          #   transformers PYSEC-2025-217   (no patched release)
          # PYSEC-2026-3740 affects nltk<=3.10.3 and has no patched release as of
          # 2026-09-03. DevSkyy does not call the affected model-artifact APIs;
          # remove this exception as soon as upstream publishes a fixed version.
          IGNORE="--ignore-vuln CVE-2026-45829 --ignore-vuln PYSEC-2026-139 --ignore-vuln CVE-2025-3000 --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2026-3740"
          # Audit the exact installed set minus the editable project (devskyy is not on
          # PyPI, and --strict also rejects --skip-editable). --strict then fails the
          # scan if any real dependency cannot be audited, instead of skipping it.
          uv pip freeze --color never --python "$(command -v python)" --exclude-editable > audit-requirements.txt
          # One scan; the readable report is rendered from its JSON. pip-audit exits
          # 1 both for findings and for a crash; only findings write the report, so a
          # run with no report is a tool/network error (a PyPI connection reset on
          # 2026-10-11 was misreported as FIXABLE). Retry that once; it never passes.
          for attempt in 1 2; do
            pip_audit_status=0
            rm -f pip-audit-results.json
            pip-audit $IGNORE --strict --no-deps --disable-pip -r audit-requirements.txt \
              --format=json --output=pip-audit-results.json || pip_audit_status=$?
            if [ "$pip_audit_status" -eq 0 ] || jq -e '.dependencies' pip-audit-results.json >/dev/null 2>&1; then
              break
            fi
            echo "::warning::pip-audit attempt $attempt errored without a report (exit $pip_audit_status)"
            if [ "$attempt" -eq 1 ]; then sleep 20; fi
          done
          report=false
          if jq -e '.dependencies' pip-audit-results.json >/dev/null 2>&1; then report=true; fi
          echo "pip_audit_report=$report" >> "$GITHUB_OUTPUT"
          jq -r '.dependencies[]? | select((.vulns // []) | length > 0)
                 | .name + " " + .version + ": "
                   + ([.vulns[] | .id + " (fix: " + ((.fix_versions // []) | join(",")) + ")"] | join("; "))' \
            pip-audit-results.json 2>/dev/null | tee pip-audit.txt || true
          echo "pip_audit_exit=$pip_audit_status" >> "$GITHUB_OUTPUT"

      - name: Run bandit (code security)
        id: bandit
        run: |
          bandit_status=0
          bandit -r . \
            -x ./tests,./venv,./.venv,./node_modules \
            -f json -o bandit-results.json \
            -ll || bandit_status=$?
          jq -r '.results[] | "\(.filename):\(.line_number) \(.test_id) \(.issue_severity)/\(.issue_confidence) \(.issue_text)"' \
            bandit-results.json 2>/dev/null | tee bandit.txt || true
          echo "bandit_exit=$bandit_status" >> "$GITHUB_OUTPUT"

      - name: Run safety check
        id: safety
        run: |
          safety_status=0
          safety check --full-report 2>&1 | tee safety.txt || safety_status=$?
          echo "safety_exit=$safety_status" >> "$GITHUB_OUTPUT"

      - name: Run semgrep (SAST)
        id: semgrep
        run: |
          if ! command -v semgrep >/dev/null; then
            echo "::warning::semgrep not installed — SAST skipped (informational)"
            exit 0
          fi
          semgrep_status=0
          # One full-repo scan (it was 2 identical ~4 min scans for JSON + text).
          semgrep scan --config=auto --error --json --output=semgrep-results.json . || semgrep_status=$?
          jq -r '.results[] | "\(.path):\(.start.line) \(.check_id) [\(.extra.severity)]"' \
            semgrep-results.json 2>/dev/null | tee semgrep.txt || true
          echo "semgrep_exit=$semgrep_status" >> "$GITHUB_OUTPUT"
        env:
          SEMGREP_RULES: "p/python"

      - name: Run custom security audit
        run: |
          if [ -f "scripts/security_audit.py" ]; then
            # Run audit; capture exit code but treat as advisory (findings need human review
            # before merge, not a hard CI block — false positives exist in SQLAlchemy compiled queries)
            python scripts/security_audit.py --report security-report.json || \
              echo "::warning::Custom security audit found issues — review security-report.json before merging"
          else
            echo "No custom security audit script found"
          fi

      - name: Generate security summary
        if: always()
        run: |
          echo "## 🔐 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # pip-audit summary
          if [ -f pip-audit-results.json ]; then
            VULN_COUNT=$(jq '[.dependencies[]? | .vulns[]?] | length' pip-audit-results.json 2>/dev/null || echo "0")
            echo "### pip-audit: $VULN_COUNT dependency vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi

          # bandit summary
          if [ -f bandit-results.json ]; then
            HIGH=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-results.json 2>/dev/null || echo "0")
            MED=$(jq '[.results[] | select(.issue_severity == "MEDIUM")] | length' bandit-results.json 2>/dev/null || echo "0")
            echo "### bandit: $HIGH high, $MED medium severity issues" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-reports
          path: |
            pip-audit*.json
            pip-audit*.txt
            bandit*.json
            bandit*.txt
            safety.txt
            semgrep*.json
            semgrep*.txt
            security-report.*
          retention-days: 30

      - name: Fail on security findings
        if: always()
        run: |
          failed=0
          pip_exit="${{ steps.pip_audit.outputs.pip_audit_exit }}"
          pip_report="${{ steps.pip_audit.outputs.pip_audit_report }}"
          bandit_exit="${{ steps.bandit.outputs.bandit_exit }}"
          semgrep_exit="${{ steps.semgrep.outputs.semgrep_exit }}"

          # pip-audit is blocking, so a scan that never reported fails too (bug-230).
          if [ -z "$pip_exit" ]; then
            echo "::error::pip-audit did not run to completion — no verdict on dependency vulnerabilities"
            failed=1
          elif [ "$pip_exit" != "0" ] && [ "$pip_report" != "true" ]; then
            echo "::error::pip-audit errored twice without producing a report (exit $pip_exit) — a tool or network failure, not a finding; re-run the job"
            failed=1
          elif [ "$pip_exit" != "0" ]; then
            echo "::error::pip-audit found FIXABLE dependency vulnerabilities (exit $pip_exit) — bump the flagged packages, or add a documented --ignore-vuln only if there is no upstream fix"
            failed=1
          fi
          if [ -n "$bandit_exit" ] && [ "$bandit_exit" != "0" ]; then
            echo "::warning::bandit found MEDIUM/LOW issues (exit $bandit_exit) — informational"
          fi
          if [ -n "$semgrep_exit" ] && [ "$semgrep_exit" != "0" ]; then
            echo "::warning::semgrep found SAST issues (exit $semgrep_exit) — informational"
          fi
          # BLOCKING: Critical bandit issues only (HIGH severity + HIGH confidence)
          if [ -f bandit-results.json ]; then
            CRITICAL=$(jq '[.results[] | select(.issue_severity == "HIGH" and .issue_confidence == "HIGH")] | length' bandit-results.json 2>/dev/null || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Found $CRITICAL critical security issues (HIGH severity + HIGH confidence)"
              failed=1
            fi
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Security scan failures detected — review reports above"
            exit 1
          fi
          echo "Security scan complete (non-critical findings above are informational)"

  # ===========================================================================
  # Stage 2: Frontend Tests (Parallel)
  # ===========================================================================
  frontend-tests:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    # Shares the `app` filter with e2e-tests, which needs this job's build artifact.
    if: >-
      !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success' || needs.changes.outputs.app == 'true')

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: frontend

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run frontend unit tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 1
          include-hidden-files: true # .next/ is a hidden dir; upload-artifact v6 skips it without this

  # ===========================================================================
  # Stage 2: Three.js Collection Tests (Parallel)
  # ===========================================================================
  threejs-tests:
    name: 🎮 Root TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The committed root lockfile provides deterministic test and audit inputs.
      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit production dependencies
        run: npm run security:audit:production

      # Asks prettier and lint-staged themselves whether they would rewrite a
      # file some program owns (data/machine-managed-files.json). This job is
      # the one that installs the ROOT node_modules, so it is where prettier is
      # available; tests/test_machine_managed_files.py covers the same registry
      # with no dependencies in the Python job.
      - name: Verify machine-managed files are invisible to formatters
        run: npm run verify:formatter-ignores

      - name: Run root unit tests
        run: npm test

      - name: Ensure PHP SQLite support for projection concurrency tests
        run: |
          if ! php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'; then
            sudo apt-get update
            sudo apt-get install -y php-cli php-sqlite3
          fi
          php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'

      - name: Test theme consent, relay, and asset cache versions
        run: npm run test:theme-analytics

      - name: Install Chromium for theme consent browser tests
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Test theme consent in desktop and mobile browsers
        run: npm run test:theme-analytics:browser

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: threejs-test-results
          path: coverage/
          retention-days: 7

  # ===========================================================================
  # Stage 2: WordPress Theme Validation (Parallel)
  # ===========================================================================
  wordpress-theme:
    name: "🏗️ WordPress Theme"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: >-
      !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success' || needs.changes.outputs.theme == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: PHP syntax check (CI-03)
        run: |
          error_count=0
          while IFS= read -r file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "::error file=$file::PHP syntax error: $output"
              error_count=$((error_count + 1))
            fi
          done < <(find wordpress-theme/skyyrose-flagship wordpress-theme/skyyrose-flagship-2 \
            -name "*.php" \
            -not -path "*/node_modules/*" \
            -not -path "*/vendor/*")
          if [ "$error_count" -gt 0 ]; then
            echo "$error_count PHP file(s) have syntax errors"
            exit 1
          fi
          echo "All PHP files passed syntax check"

      - name: Flagship 2 express-checkout regression
        run: php wordpress-theme/skyyrose-flagship-2/scripts/test-express-checkout.php

      # package.json + build scripts live in wordpress-theme/ (the build:css/build:js
      # scripts reference the skyyrose-flagship/ subdir). Running from the subdir
      # itself fails with ENOENT (no package.json there).
      - name: Install theme dependencies
        working-directory: wordpress-theme
        run: npm install

      - name: Build theme assets (CI-04)
        working-directory: wordpress-theme
        run: npm run build

      - name: Check for minification drift (CI-05)
        run: |
          if git status --porcelain --untracked-files=all -- wordpress-theme/skyyrose-flagship \
            | grep -Eq '\.min\.(js|css)$'; then
            echo ""
            echo "::error::Minification drift detected! Build output differs from committed .min files."
            echo "Fix: cd wordpress-theme/skyyrose-flagship && npm run build && git add -A && git commit"
            exit 1
          fi
          echo "No minification drift -- build output is clean"

      # skyyrose-flagship-2 is self-contained: its own package.json (npm-shrinkwrap
      # pins clean-css/terser) and scripts/build-assets.mjs, whose --check mode
      # compares the committed .min files against a fresh build without writing.
      - name: Install Flagship 2 theme dependencies
        working-directory: wordpress-theme/skyyrose-flagship-2
        run: npm ci

      - name: Check Flagship 2 minification drift (CI-05b)
        working-directory: wordpress-theme/skyyrose-flagship-2
        run: |
          if ! npm run check:assets; then
            echo "::error::Flagship 2 minification drift: committed .min files differ from a fresh build."
            echo "Fix: cd wordpress-theme/skyyrose-flagship-2 && npm run build:assets && git add assets && git commit"
            exit 1
          fi

      # The deployed presentation registry must be exactly what committed code
      # produces from the committed product registry. The V2 source
      # certification workflow also checks this, but it is path-filtered and
      # not required; live once shipped a registry no commit could rebuild.
      # (WebP renditions stay in that ARM64 job: x86 encodes different bytes.)
      - name: Set up Python for Flagship 2 generated-data checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"

      - name: Check Flagship 2 generated product data drift (CI-05c)
        run: |
          python -m pip install -r tools/v2-source-certification/requirements.txt
          python scripts/sync_product_registry.py --check
          npm --prefix wordpress-theme/skyyrose-flagship-2 run check:registry
          php wordpress-theme/skyyrose-flagship-2/scripts/test-marketplace-registry.php

  # ===========================================================================
  # Stage 3: E2E Tests with Playwright
  # ===========================================================================
  e2e-tests:
    name: 🎭 Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Browser regressions must fail CI now that the suite covers current behavior.
    # `!cancelled()` lets the change filter decide; the explicit results keep the
    # old rule that E2E only runs on top of passing Python and frontend jobs.
    needs: [changes, python-tests, frontend-tests]
    if: >-
      !cancelled() && !inputs.skip_e2e
      && needs.python-tests.result == 'success' && needs.frontend-tests.result == 'success'
      && (github.event_name != 'pull_request'
      || needs.changes.result != 'success' || needs.changes.outputs.app == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # main_enterprise:app imports boto3/scikit-image/trimesh/pyotp transitively;
      # without them the backend fails to boot and the Playwright run hangs.
      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: dev,mcp
          packages: uvicorn boto3 scikit-image trimesh pyotp

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: frontend

      - name: Install Playwright
        # Install inside frontend/ so the binary that runs tests is the same one
        # that downloads browsers. npx resolves the Python playwright first (v1.60,
        # headless-shell-1208) which conflicts with the Node @playwright/test version.
        # Using ./node_modules/.bin/playwright from the same directory avoids the mismatch.
        working-directory: frontend
        run: |
          npm install -D @playwright/test
          # mobile project uses iPhone 14 (WebKit engine), chromium for Desktop Chrome.
          ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: frontend/.next/

      - name: Start backend server
        run: |
          python -m uvicorn main_enterprise:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to start..."
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done
        env:
          PYTHONPATH: ${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0

      - name: Start frontend server
        run: |
          # Ephemeral authentication key for this isolated localhost test run.
          # Production-mode NextAuth refuses to render without a signing key.
          export NEXTAUTH_SECRET="$(openssl rand -hex 32)"
          npm run start &
          echo "Waiting for frontend to start..."
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break || sleep 2; done
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXTAUTH_URL: http://localhost:3000

      - name: Run Playwright tests
        # Keep slow or failing browser runs bounded and retain their failure status.
        timeout-minutes: 15
        # `--reporter=list,html`: the `list` reporter streams per-test results to the
        # CI log (a bare `--reporter=html` overrode the config's list reporter, so the
        # run produced ZERO output and the 15-min timeout was a black box — you could
        # not tell which test hung). `html` is kept for the uploaded report artifact.
        # `--max-failures=10`: bail fast instead of grinding 42 serial tests (workers=1,
        # retries=2 = up to 90s each) past the 15-min cap with no signal.
        run: ./node_modules/.bin/playwright test --reporter=list,html --max-failures=10
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:8000

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload Playwright traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # ===========================================================================
  # Stage 3: API Integration Tests
  # ===========================================================================
  api-integration:
    name: 🔌 API Integration Tests
    # Same services:/redis Linux-only constraint as python-tests above.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [python-tests]

    services:
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extras: dev,mcp
          packages: httpx pytest-asyncio boto3

      - name: Run API integration tests
        run: |
          pytest tests/test_*api*.py tests/test_*dashboard*.py \
            -v \
            --junitxml=api-test-results.xml
        env:
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload API test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-test-results
          path: api-test-results.xml
          retention-days: 7

  # ===========================================================================
  # Stage 4: Docker Build
  # ===========================================================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    # The .[all] backend image pulls the full ML stack (torch+CUDA, transformers,
    # mineru, chromadb, faiss, sentence-transformers) — a multi-GB image whose
    # build + GHCR push legitimately exceeds 20 min cold. Deps now resolve (aiofiles
    # cap); the only remaining failure was this timeout. 45 min fits the real build.
    timeout-minutes: 45
    needs: [python-tests, frontend-tests, security]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Path filter (2026-07-07): the GHCR image this job pushes has NO deploy
      # consumer (deploys are gated manual runs; see tasks/mcp-golive-manifest.md
      # and the P5 Fly backend plan). A 20-45 min multi-GB build on every main
      # push is pure cost unless build inputs actually changed — skip otherwise.
      - name: Detect build-relevant changes
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"  # unknown base — build to be safe
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" \
             | grep -qE '^(Dockerfile$|pyproject\.toml$|frontend/Dockerfile$|frontend/package(-lock)?\.json$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker build skipped — no build-relevant files changed (Dockerfile, pyproject.toml, frontend/Dockerfile, frontend/package*.json)"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.build == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.changes.outputs.build == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build backend image
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}-backend
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}-frontend
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
        if: steps.changes.outputs.build == 'true' && hashFiles('frontend/Dockerfile') != ''

  # ===========================================================================
  # Stage 4.5: [all] extras resolvability canary
  # ===========================================================================
  # Dependabot has broken the [all] extras graph 6 times (torch trio, aiofiles,
  # cryptography, click, beautifulsoup4, mlflow) — each found LATE, at Docker
  # build time. This canary resolves the full graph in ~1-2 min on any PR that
  # touches pyproject.toml, failing fast instead. (Added 2026-07-07, P4.)
  deps-resolve-canary:
    name: 🧪 Deps Canary ([all] resolves)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether pyproject.toml changed in this PR
        id: touched
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if ! git fetch --quiet --depth=1 origin "$BASE" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"  # unknown base — check to be safe
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD -- pyproject.toml | grep -q pyproject.toml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pyproject.toml untouched — dependency canary skipped"
          fi

      - name: Set up Python
        if: steps.touched.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve [all] extras
        if: steps.touched.outputs.changed == 'true'
        run: |
          pip install --quiet uv
          # Resolution only — nothing is downloaded/installed. Flags verified
          # against uv 0.11.x (--extra, --python-version, -o).
          lockfile="$(mktemp)"
          trap 'rm -f "$lockfile"' EXIT
          uv pip compile pyproject.toml --extra all --python-version "${{ env.PYTHON_VERSION }}" -o "$lockfile"

  # ===========================================================================
  # Stage 5: Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [python-tests, frontend-tests, security, api-integration]
    # DISABLED 2026-07-07: Render deploy hooks are inert (secrets never configured,
    # no render.yaml exists) and the URLs referenced the wrong domain (skyyrose.com,
    # corrected to skyyrose.co 2026-09-19). Real deploys are gated manual runs — see
    # tasks/mcp-golive-manifest.md; backend production home is the planned Fly app
    # (P5, ~/.claude/plans/lucky-nibbling-oasis.md). Re-enable only with a real target.
    if: false
    environment:
      name: staging
      url: https://staging-7e48-skyyrose.wpcomstaging.com

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy backend to Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Backend deployment triggered"
          else
            echo "::warning::RENDER_DEPLOY_HOOK not configured"
          fi

      - name: Notify deployment
        run: |
          echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Stage 5: Deploy to Production
  # ===========================================================================
  deploy-production:
    name: 🌐 Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [python-tests, frontend-tests, security, api-integration, e2e-tests]
    # DISABLED 2026-07-07: same reasons as deploy-staging (inert Render hooks, wrong
    # domain) — and this job's needs included the explicitly non-gating e2e suite,
    # making the "gate" theater. Production deploys are STOP-AND-SHOW manual runs.
    if: false
    environment:
      name: production
      url: https://skyyrose.co

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Security gate check
        run: |
          echo "Verifying all security checks passed..."
          # This step runs after security job succeeds

      - name: Deploy backend to Render (Production)
        run: |
          if [ -n "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
            echo "Production backend deployment triggered"
          else
            echo "::warning::RENDER_PROD_DEPLOY_HOOK not configured"
          fi

      - name: Create deployment tag
        if: success()
        run: |
          TAG="deploy-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production deployment ${GITHUB_SHA::7}"
          git push origin "$TAG" || echo "::warning::Could not push tag $TAG"

      - name: Notify deployment success
        run: |
          echo "## 🌐 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://skyyrose.co" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Workflow Summary
  # ===========================================================================
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, python-tests, security, frontend-tests, threejs-tests, wordpress-theme, e2e-tests, api-integration]
    if: always()

    steps:
      - name: Generate summary
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## 📊 CI/CD Pipeline Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          # "skipped" passes: a path-filtered job whose files did not change.
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$RESULTS")
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $(tr '\n' ' ' <<< "$bad")"
            exit 1
          fi
