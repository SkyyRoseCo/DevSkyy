name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Review only the latest push: a new commit cancels the in-flight review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # The action rejects bot-triggered events. Keep the code/security test jobs
    # active for dependency PRs while limiting this advisory reviewer to humans.
    if: >-
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.user.type != 'Bot'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Start attempt clock
        id: attempt-clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@35037bb980d9bc03f0f74b65b68618b0be46c268 # v1
        with:
          # Use the job-scoped token on internal PRs so workflow changes can be
          # reviewed before merging. Forks retain the GitHub App auth path.
          github_token: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.token || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # One retry absorbs a transient action/API outage — the 2026-10-11 00:07-00:30Z
      # window had every run exit in ~0.5s at $0. Only a FAST failure is retried (a
      # genuine failure that ran for minutes is not re-run); without a retry, the
      # last step fails the job, so continue-on-error never masks a real failure.
      - name: Decide whether to retry
        id: retry-decision
        if: steps.claude-review.outcome == 'failure'
        env:
          START: ${{ steps.attempt-clock.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - START ))
          retry=false
          if [ "$elapsed" -lt 120 ]; then retry=true; fi
          echo "First attempt failed after ${elapsed}s; retry=$retry"
          echo "retry=$retry" >> "$GITHUB_OUTPUT"

      - name: Wait before retrying
        if: steps.retry-decision.outputs.retry == 'true'
        run: sleep 60

      # The first attempt registered the plugin marketplace under ~/.claude/plugins,
      # and the action's `marketplace add` refuses to re-add it ("already
      # installed"), which failed every retry. The runner is ephemeral.
      - name: Reset plugin state before retrying
        if: steps.retry-decision.outputs.retry == 'true'
        run: rm -rf "$HOME/.claude/plugins"

      - name: Retry Run Claude Code Review
        id: claude-review-retry
        if: steps.retry-decision.outputs.retry == 'true'
        uses: anthropics/claude-code-action@35037bb980d9bc03f0f74b65b68618b0be46c268 # v1
        with:
          # Use the job-scoped token on internal PRs so workflow changes can be
          # reviewed before merging. Forks retain the GitHub App auth path.
          github_token: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.token || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # A run that never reached the model still ends `subtype: success` — from
      # 2026-09 to 2026-10-11 a revoked token passed every review at 4 turns and $0
      # while real reviews cost $0.69-$1.01. Fail unless the attempt that succeeded
      # recorded a real, paid run. The check is inline, never a ./ action, because
      # the workspace holds the PR's code.
      - name: Fail when Claude did not actually run
        if: ${{ steps.claude-review.outcome == 'success' || steps.claude-review-retry.outcome == 'success' }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review-retry.outputs.execution_file || steps.claude-review.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo "::error::Claude reported success but left no execution file — the run cannot be verified."
            exit 1
          fi
          if ! read -r turns cost < <(jq -r '[.[] | select(.type == "result")] | last
              | "\(.num_turns // "none") \(.total_cost_usd // "none")"' "$EXECUTION_FILE"); then
            echo "::error::Claude's execution file is not readable JSON — the run cannot be verified."
            exit 1
          fi
          if ! awk -v c="$cost" 'BEGIN { exit !(c + 0 > 0) }'; then
            echo "::error::Claude reported success after ${turns} turns at \$${cost}: it never reached the model (revoked or missing CLAUDE_CODE_OAUTH_TOKEN?). Nothing was reviewed."
            exit 1
          fi
          echo "Claude ran: ${turns} turns, \$${cost}"

      - name: Fail when the first attempt failed and was not retried
        if: ${{ steps.claude-review.outcome == 'failure' && steps.retry-decision.outputs.retry != 'true' }}
        run: |
          echo "::error::Run Claude Code Review failed and was not a fast (outage) failure — see the step log above."
          exit 1
