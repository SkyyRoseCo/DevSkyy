name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Review only the latest push: a new commit cancels the in-flight review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # The action rejects bot-triggered events. Keep the code/security test jobs
    # active for dependency PRs while limiting this advisory reviewer to humans.
    if: >-
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.user.type != 'Bot'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # TEMPORARY (PR #1030 diagnosis): run the startup hooks the CLI will run, in the
      # runner's environment, and print each one's exit code and output. Remove before merge.
      - name: "DIAG: run startup hooks"
        continue-on-error: true
        env:
          PROMPT: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
        run: |
          export CLAUDE_PROJECT_DIR="$PWD" CLAUDE_CODE_ACTION=1
          eval "$(jq -r '.env // {} | to_entries[] | "export \(.key)=\(.value|@sh)"' .claude/settings.json)"
          export HOME="$(mktemp -d)"
          python3 --version; bash --version | head -1
          for ev in SessionStart UserPromptSubmit; do
            jq -r --arg ev "$ev" '.hooks[$ev][]?.hooks[]?.command' .claude/settings.json | while IFS= read -r cmd; do
              input=$(jq -nc --arg ev "$ev" --arg p "$PROMPT" --arg cwd "$PWD" \
                '{session_id:"diag",hook_event_name:$ev,source:"startup",prompt:$p,cwd:$cwd,transcript_path:"/tmp/none.jsonl"}')
              set +e
              out=$(printf '%s' "$input" | bash -c "$cmd" 2>/tmp/hook.err); rc=$?
              set -e
              echo "::group::$ev rc=$rc :: $cmd"
              echo "--- stdout (first 1500 chars)"; printf '%s\n' "${out:0:1500}"
              echo "--- stderr (first 1500 chars)"; head -c 1500 /tmp/hook.err; echo
              echo "::endgroup::"
              echo "SUMMARY $ev rc=$rc stdout_bytes=${#out} :: $cmd"
            done
          done

      - name: Start attempt clock
        id: attempt-clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@35037bb980d9bc03f0f74b65b68618b0be46c268  # v1
        with:
          # Use the job-scoped token on internal PRs so workflow changes can be
          # reviewed before merging. Forks retain the GitHub App auth path.
          github_token: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.token || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # One retry absorbs a transient action/API outage — the 2026-10-11 00:07-00:30Z
      # window had every run exit in ~0.5s at $0. Only a FAST failure is retried (a
      # genuine failure that ran for minutes is not re-run); without a retry, the
      # last step fails the job, so continue-on-error never masks a real failure.
      - name: Decide whether to retry
        id: retry-decision
        if: steps.claude-review.outcome == 'failure'
        env:
          START: ${{ steps.attempt-clock.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - START ))
          retry=false
          if [ "$elapsed" -lt 120 ]; then retry=true; fi
          echo "First attempt failed after ${elapsed}s; retry=$retry"
          echo "retry=$retry" >> "$GITHUB_OUTPUT"

      - name: Wait before retrying
        if: steps.retry-decision.outputs.retry == 'true'
        run: sleep 60

      - name: Retry Run Claude Code Review
        if: steps.retry-decision.outputs.retry == 'true'
        uses: anthropics/claude-code-action@35037bb980d9bc03f0f74b65b68618b0be46c268  # v1
        with:
          # Use the job-scoped token on internal PRs so workflow changes can be
          # reviewed before merging. Forks retain the GitHub App auth path.
          github_token: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.token || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Fail when the first attempt failed and was not retried
        if: ${{ steps.claude-review.outcome == 'failure' && steps.retry-decision.outputs.retry != 'true' }}
        run: |
          echo "::error::Run Claude Code Review failed and was not a fast (outage) failure — see the step log above."
          exit 1
