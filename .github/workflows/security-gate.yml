# =============================================================================
# DevSkyy Security Gate
# =============================================================================
# Additional security checks that must pass before merging to main.
# Integrates with branch protection rules.
# =============================================================================

name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ===========================================================================
  # Secrets Scanning
  # ===========================================================================
  secrets-scan:
    name: 🔑 Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact --config .gitleaks.toml

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run TruffleHog
        run: trufflehog git file://. --only-verified --no-update

  # ===========================================================================
  # Dependency Review
  # ===========================================================================
  dependency-review:
    name: 📦 Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@46a3c492319c890177366b6ef46d6b4f89743ed4  # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          allow-dependencies-licenses: 'pkg:pypi/example@1.0.0'

  # ===========================================================================
  # License Compliance
  # ===========================================================================
  license-check:
    name: 📜 License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pip-licenses
          pip install -e ".[dev]" || pip install -e . || true

      # Policy: block copyleft (GPL/AGPL) only — mirrors the dependency-review
      # deny list. The prior --allow-only whitelist was deny-by-default and
      # false-positived on legitimate proprietary runtime deps (e.g. the NVIDIA
      # CUDA libraries pulled in transitively by torch) and any unlisted license
      # string. --fail-on captures the actual intent without the brittleness.
      - name: Check Python licenses
        run: |
          pip-licenses --format=markdown --with-urls > licenses.md
          pip-licenses --fail-on="GPL-3.0-only;AGPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-or-later"

      - name: Upload license report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: license-report
          path: licenses.md
          retention-days: 30

  # ===========================================================================
  # SBOM Generation
  # ===========================================================================
  sbom:
    name: 📋 SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Generate Python SBOM
        run: syft . -o spdx-json=sbom-python.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom-*.spdx.json
          retention-days: 90

  # ===========================================================================
  # Security Summary
  # ===========================================================================
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [secrets-scan, license-check]
    if: always()

    steps:
      - name: Generate security summary
        run: |
          echo "## 🔐 Security Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📜 License | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.secrets-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.license-check.result }}" == "failure" ]]; then
            echo "⚠️ **Some security checks failed. Review before merging.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All security checks passed.**" >> $GITHUB_STEP_SUMMARY
          fi
