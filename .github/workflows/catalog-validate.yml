name: Catalog Consistency

on:
  pull_request:
    paths:
      - "wordpress-theme/skyyrose-flagship/data/**"
      - "skyyrose/elite_studio/sku_resolver.py"
      - "skyyrose/elite_studio/logo_registry.py"
      - "skyyrose/elite_studio/commerce.py"
      - "scripts/validate_catalog_consistency.py"
      - ".github/workflows/catalog-validate.yml"
      - "scripts/sync_catalog_downstream.py"
      - "skyyrose/elite_studio/tests/test_catalog_consistency.py"
      - "skyyrose/elite_studio/tests/conftest.py"
      - "scripts/build_v7_cards.py"
      - "skyyrose/core/catalog_loader.py"
      - "skyyrose/core/product_registry.py"
      - "skyyrose/core/product.py"
      - "scripts/organize_product_registry.py"
      - "tests/test_registry_organization.py"
      - "wordpress-theme/skyyrose-flagship/data/logo-registry.schema.json"
      - "tests/test_product_entry_point.py"
      - "skyyrose/assets/data/product-content.json"
      - "skyyrose/assets/data/alt-text.json"
      - "skyyrose/core/dossier_loader.py"
      - "skyyrose/core/sot_images.py"
      - "scripts/sync_product_registry.py"
      - "tests/test_unified_product_registry.py"
      - "tests/test_registry_product_readers.py"
      - "tests/test_registry_php_parity.py"
      - "tests/test_bridge_asset_readiness.py"
      - "scripts/scaffold_sku_asset_folders.py"
      - "wordpress-theme/skyyrose-flagship/inc/product-catalog.php"
      - "scripts/oai_render/**"
      - "skyyrose/elite_studio/tests/test_logo_registry.py"
      - "scripts/build-lookbook-sot.py"
      - "scripts/build-lookbook-from-sot.py"
      - "scripts/lookbook-manifest.json"
      - "docs/campaigns/sot-lookbook.html"
      - "wordpress-theme/skyyrose-flagship/data/lookbook-sot.json"
      - "wordpress-theme/skyyrose-flagship/assets/**"
      - "tests/test_v7_cards_generator.py"
  push:
    branches: [main]
    paths:
      - "wordpress-theme/skyyrose-flagship/data/**"
      - "skyyrose/elite_studio/sku_resolver.py"
      - "skyyrose/elite_studio/logo_registry.py"
      - "scripts/validate_catalog_consistency.py"
      - ".github/workflows/catalog-validate.yml"
      - "scripts/build_v7_cards.py"
      - "skyyrose/core/catalog_loader.py"
      - "skyyrose/core/product_registry.py"
      - "skyyrose/core/product.py"
      - "scripts/organize_product_registry.py"
      - "tests/test_registry_organization.py"
      - "wordpress-theme/skyyrose-flagship/data/logo-registry.schema.json"
      - "tests/test_product_entry_point.py"
      - "skyyrose/assets/data/product-content.json"
      - "skyyrose/assets/data/alt-text.json"
      - "skyyrose/core/dossier_loader.py"
      - "skyyrose/core/sot_images.py"
      - "scripts/sync_product_registry.py"
      - "tests/test_unified_product_registry.py"
      - "tests/test_registry_product_readers.py"
      - "tests/test_registry_php_parity.py"
      - "tests/test_bridge_asset_readiness.py"
      - "scripts/scaffold_sku_asset_folders.py"
      - "wordpress-theme/skyyrose-flagship/inc/product-catalog.php"
      - "scripts/oai_render/**"
      - "skyyrose/elite_studio/tests/test_logo_registry.py"
      - "scripts/build-lookbook-sot.py"
      - "scripts/build-lookbook-from-sot.py"
      - "scripts/lookbook-manifest.json"
      - "docs/campaigns/sot-lookbook.html"
      - "wordpress-theme/skyyrose-flagship/data/lookbook-sot.json"
      - "wordpress-theme/skyyrose-flagship/assets/**"

jobs:
  validate:
    name: Catalog Consistency Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          # The validator step is near-stdlib: the only third-party import is jsonschema,
          # reached when collection_sot_current regenerates the per-collection SOT
          # (build-collection-sot.py validates identity.json against its schema). The pytest
          # step collects test_catalog_consistency.py + the (lazy-import) shared conftest,
          # which need only pytest + pytest-asyncio (asyncio_mode is declared in pyproject;
          # without pytest-asyncio pytest errors "Unknown config option").
          # No project/base install — `.[dev]` pulls the heavy provider stack, was
          # timing out, and silently fell back to a pytest-only env that failed.
          pip install pytest pytest-asyncio jsonschema cryptography PyJWT argon2-cffi passlib email-validator fastapi python-multipart --quiet

      - name: Run catalog consistency validator
        run: |
          python scripts/validate_catalog_consistency.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run catalog consistency validator (JSON output for annotations)
        if: failure()
        run: |
          python scripts/validate_catalog_consistency.py --json 2>&1 | \
            python -c "
          import json, sys
          data = json.load(sys.stdin)
          for check in data['checks']:
              if not check['passed']:
                  print(f\"::error title=Catalog Check Failed [{check['name']}]::{check['message']}\")
                  for detail in check['details']:
                      print(f\"::warning::{detail.strip()}\")
          "
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verify registry compatibility exports
        run: python scripts/sync_product_registry.py --check

      - name: Verify visual manifest (all declared imagery exists on disk)
        # bug-250: this verifier existed but was wired into nothing — a gate that
        # never runs is drift cover. Every path+format declared in
        # visual-manifest.json must exist in the tracked theme assets.
        run: |
          python wordpress-theme/skyyrose-flagship/data/verify-visual-manifest.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verify registry organization (schema + consistency)
        run: |
          python scripts/organize_product_registry.py --check --quiet || true
          pytest tests/test_registry_organization.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verify the single product entry point (all SKUs resolve or declare gaps)
        run: pytest tests/test_product_entry_point.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run pytest — catalog consistency tests
        run: |
          pytest skyyrose/elite_studio/tests/test_catalog_consistency.py \
                 tests/test_collection_sot_guard.py tests/test_lookbook_sot_guard.py \
                 tests/test_unified_product_registry.py tests/test_registry_product_readers.py \
                 tests/test_registry_php_parity.py \
                 tests/test_bridge_asset_readiness.py \
                 skyyrose/elite_studio/tests/test_logo_registry.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  retired-sku-scan:
    name: Retired SKU Guard
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Scan for retired SKU references
        run: |
          # Hard fail if br-013 appears in any tracked Python/JSON/PHP/CSV file
          RETIRED_SKUS="br-013"
          FOUND=0
          for sku in $RETIRED_SKUS; do
            # Search tracked files, exclude .git/, .bak files, and this workflow itself
            if git grep --quiet \
                --include="*.py" \
                --include="*.json" \
                --include="*.php" \
                --include="*.csv" \
                "$sku" -- \
                ':!.git' \
                ':!.github/workflows/catalog-validate.yml' \
                ':!*.bak-pre-sync-*' 2>/dev/null; then
              echo "::error::Retired SKU '$sku' found in tracked files:"
              git grep \
                --include="*.py" \
                --include="*.json" \
                --include="*.php" \
                --include="*.csv" \
                "$sku" -- \
                ':!.git' \
                ':!.github/workflows/catalog-validate.yml' \
                ':!*.bak-pre-sync-*' || true
              FOUND=1
            fi
          done
          if [[ "$FOUND" == "1" ]]; then
            echo ""
            echo "Fix: python scripts/sync_catalog_downstream.py --dry-run"
            exit 1
          fi
          echo "No retired SKU references found."
