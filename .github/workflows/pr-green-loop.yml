name: PR Green Loop

# Event-driven drive-to-green for internal pull requests.
# Starts only when a CI run has FINISHED with a failure, so no runner sits idle
# waiting for CI (the old pull_request trigger ran `gh pr checks --watch` for 15-35
# min per push, holding 1 of the free plan's 20 concurrent runners). It reads the
# failed logs, fixes the root cause, and pushes; a deterministic step then dispatches
# CI on the fixed commit.
# If that run fails too, this workflow fires again — up to MAX_FIX_COMMITS.
#
# Safety model:
# - Internal branches only (head repository == this repository). Forks never get
#   this job's write token; they still get the read-only claude-code-review.yml.
# - workflow_run always executes the DEFAULT BRANCH's copy of this file, so a PR
#   cannot change the job that runs with these permissions.
# - The PR must still be open, non-draft, non-Dependabot, and its head must still
#   be the commit CI failed on (a newer push gets its own CI run).
# - Pushes use GITHUB_TOKEN, which does not trigger workflows; the loop dispatches
#   CI explicitly (outside the model) so the fix itself is tested.
# - Never force-pushes, merges, deploys, calls a paid API, or weakens a test.

on:
  workflow_run:
    workflows: ["DevSkyy CI/CD Pipeline"]
    types: [completed]

permissions:
  contents: write # push fixes to the PR head branch
  pull-requests: write # resolve threads, comment
  actions: write # dispatch CI on the fixed commit
  checks: read
  id-token: write

concurrency:
  group: pr-green-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  MAX_FIX_COMMITS: 5

jobs:
  green-loop:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open \
                 --json number,isDraft,author,headRefOid --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "::notice::No open PR for $HEAD_BRANCH — nothing to drive."
            echo "eligible=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          eligible=$(jq --arg sha "$HEAD_SHA" \
            '(.isDraft | not) and (.author.login | test("dependabot") | not) and .headRefOid == $sha' <<< "$pr")
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r .number <<< "$pr")" >> "$GITHUB_OUTPUT"
          [ "$eligible" = "true" ] || echo "::notice::PR is draft, Dependabot, or has moved past $HEAD_SHA — skipping."

      - name: Checkout PR head
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify head and fix-commit budget
        id: budget
        if: steps.pr.outputs.eligible == 'true'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --quiet origin main
          used=$(git log origin/main..HEAD --author='github-actions\[bot\]' --format=%H | wc -l | tr -d ' ')
          echo "used=$used" >> "$GITHUB_OUTPUT"
          if [ "$used" -ge "$MAX_FIX_COMMITS" ]; then
            echo "::warning::$used bot fix commits already on this PR (cap $MAX_FIX_COMMITS) — stopping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure bot identity
        if: steps.budget.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start attempt clock
        id: attempt-clock
        if: steps.budget.outputs.go == 'true'
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run PR green loop
        id: green-loop-run
        if: steps.budget.outputs.go == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@35037bb980d9bc03f0f74b65b68618b0be46c268 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowed-tools "Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            CI run ${{ github.event.workflow_run.id }} ("${{ github.event.workflow_run.name }}") just
            FINISHED with a failure on PR #${{ steps.pr.outputs.number }} in ${{ github.repository }},
            commit ${{ github.event.workflow_run.head_sha }}. The PR head branch
            `${{ github.event.workflow_run.head_branch }}` is checked out and writable with the default
            GITHUB_TOKEN (`gh` is authenticated). Follow the project agent
            `.claude/agents/pr-green-loop.md` if present; otherwise use these rules verbatim.
            Bot fix commits already on this PR: ${{ steps.budget.outputs.used }} of ${{ env.MAX_FIX_COMMITS }}.

            ## One fix cycle (this job runs once per failed CI run — do not wait or poll)
            1. Read the failures: `gh run view ${{ github.event.workflow_run.id }} --log-failed`, plus
               `gh pr checks ${{ steps.pr.outputs.number }}` and
               `gh pr view ${{ steps.pr.outputs.number }} --json mergeable,mergeStateStatus,reviewDecision`.
            2. Split REAL vs NOISE. NOISE (ignore): any `skipping`/`skipped` check, `PR Agent Analysis`
               concurrency self-cancel. Every other failed job is REAL — including Playwright E2E and
               API Integration, which are required checks on `main`.
            3. For each REAL failure (bots CodeRabbit/cubic/claude-review are ADVISORY — verify each
               against the code; fix real ones, reply + dismiss false ones): fix the ROOT CAUSE. Verify
               locally before pushing — `python -m pytest <paths> -q`, `ruff check`, `black --check`,
               `mypy <module>`, or the frontend/phpcs equivalent. Never weaken a test or suppress a check.
            4. Commit (conventional subject) and `git push`, then exit. The workflow's next step
               dispatches CI on your commit; do not dispatch or re-run CI yourself. If that CI run
               fails, this workflow starts the next cycle automatically.
            5. Do not push when the failure traces to the base branch rather than this diff, when the
               same check already failed after a bot fix for it, or when nothing REAL failed — instead
               post ONE concise comment saying what is blocked and why, then exit.

            ## Boundaries (absolute)
            Never merge. Never force-push. Never act over a human CHANGES_REQUESTED (report instead).
            Never deploy to skyyrose.co, never a WooCommerce/media write, never a paid API call.
            Anti-hallucination: every "the failure is X" must trace to a CI log you read this run.

      # One retry absorbs a transient action/API outage — the 2026-10-11 00:07-00:30Z
      # window had every run exit in ~0.5s at $0. Only a FAST failure is retried (a
      # genuine failure that ran for minutes is not re-run); without a retry, the
      # last step fails the job, so continue-on-error never masks a real failure.
      - name: Decide whether to retry
        id: retry-decision
        if: steps.budget.outputs.go == 'true' && steps.green-loop-run.outcome == 'failure'
        env:
          START: ${{ steps.attempt-clock.outputs.start }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          elapsed=$(( $(date +%s) - START ))
          retry=false
          if [ "$elapsed" -lt 120 ] && [ "$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)" = "$HEAD_SHA" ]; then retry=true; fi
          echo "First attempt failed after ${elapsed}s; retry=$retry"
          echo "retry=$retry" >> "$GITHUB_OUTPUT"

      - name: Wait before retrying
        if: steps.budget.outputs.go == 'true' && steps.retry-decision.outputs.retry == 'true'
        run: sleep 60

      - name: Retry Run PR green loop
        if: steps.budget.outputs.go == 'true' && steps.retry-decision.outputs.retry == 'true'
        uses: anthropics/claude-code-action@35037bb980d9bc03f0f74b65b68618b0be46c268 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowed-tools "Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            CI run ${{ github.event.workflow_run.id }} ("${{ github.event.workflow_run.name }}") just
            FINISHED with a failure on PR #${{ steps.pr.outputs.number }} in ${{ github.repository }},
            commit ${{ github.event.workflow_run.head_sha }}. The PR head branch
            `${{ github.event.workflow_run.head_branch }}` is checked out and writable with the default
            GITHUB_TOKEN (`gh` is authenticated). Follow the project agent
            `.claude/agents/pr-green-loop.md` if present; otherwise use these rules verbatim.
            Bot fix commits already on this PR: ${{ steps.budget.outputs.used }} of ${{ env.MAX_FIX_COMMITS }}.

            ## One fix cycle (this job runs once per failed CI run — do not wait or poll)
            1. Read the failures: `gh run view ${{ github.event.workflow_run.id }} --log-failed`, plus
               `gh pr checks ${{ steps.pr.outputs.number }}` and
               `gh pr view ${{ steps.pr.outputs.number }} --json mergeable,mergeStateStatus,reviewDecision`.
            2. Split REAL vs NOISE. NOISE (ignore): any `skipping`/`skipped` check, `PR Agent Analysis`
               concurrency self-cancel. Every other failed job is REAL — including Playwright E2E and
               API Integration, which are required checks on `main`.
            3. For each REAL failure (bots CodeRabbit/cubic/claude-review are ADVISORY — verify each
               against the code; fix real ones, reply + dismiss false ones): fix the ROOT CAUSE. Verify
               locally before pushing — `python -m pytest <paths> -q`, `ruff check`, `black --check`,
               `mypy <module>`, or the frontend/phpcs equivalent. Never weaken a test or suppress a check.
            4. Commit (conventional subject) and `git push`, then exit. The workflow's next step
               dispatches CI on your commit; do not dispatch or re-run CI yourself. If that CI run
               fails, this workflow starts the next cycle automatically.
            5. Do not push when the failure traces to the base branch rather than this diff, when the
               same check already failed after a bot fix for it, or when nothing REAL failed — instead
               post ONE concise comment saying what is blocked and why, then exit.

            ## Boundaries (absolute)
            Never merge. Never force-push. Never act over a human CHANGES_REQUESTED (report instead).
            Never deploy to skyyrose.co, never a WooCommerce/media write, never a paid API call.
            Anti-hallucination: every "the failure is X" must trace to a CI log you read this run.

      # GITHUB_TOKEN pushes trigger no workflows and `gh run rerun` re-tests the OLD
      # commit, so dispatch both gating workflows on the bot's fix here, outside the
      # model — a missed instruction can never leave a fix untested.
      - name: Dispatch CI on the bot fix
        if: ${{ !cancelled() && steps.budget.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags --quiet origin "refs/heads/$HEAD_BRANCH"
          remote=$(git rev-parse FETCH_HEAD)
          author=$(git log -1 --format=%an FETCH_HEAD)
          if [ "$remote" = "$HEAD_SHA" ]; then
            echo "::notice::No fix pushed — nothing to dispatch."; exit 0
          fi
          if [ "$author" != "github-actions[bot]" ]; then
            echo "::notice::Head moved to a non-bot commit ($author); its own push runs CI."; exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          gh workflow run security-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          echo "::notice::Dispatched CI and Security Gate on $remote."

      - name: Fail when the first attempt failed and was not retried
        if: ${{ steps.budget.outputs.go == 'true' && steps.green-loop-run.outcome == 'failure' && steps.retry-decision.outputs.retry != 'true' }}
        run: |
          echo "::error::Run PR green loop failed and was not a fast (outage) failure — see the step log above."
          exit 1
