sandbox_mode = "danger-full-access"
model_reasoning_summary = "detailed"

model_verbosity = "high"
[features]
code_mode = true
code_mode_host = true
code_mode_only = true
deferred_executor = true
deferred_tool_world_state = true
executor_capability_discovery = true
skill_search = true

[mcp_servers.gemini-api-docs-mcp]
type = "http"
url = "https://gemini-api-docs-mcp.dev"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_AUTOCOMPACT_PCT_OVERRIDE = "60"
CLAUDE_CODE_SUBAGENT_MODEL = "fable"
CONTEXT7_PREFETCH_DISABLE = "1"
CANON_PREFETCH_DISABLE = "1"
PROMPT_ENG_NUDGE_DISABLE = "1"
ENABLE_TOOL_SEARCH = "true"

# Safe local default. Change explicitly for a production operation; this preset
# does not grant credentials, deployment permission, or provider access.
SKYYROSE_ACTIVE_ENV = "staging"
SKYYROSE_DEFAULT_ENV = "staging"
SKYYROSE_DEPLOY_TARGET = "staging"
SKYYROSE_ENV_PRODUCTION = "production"
SKYYROSE_ENV_STAGING = "staging"
SKYYROSE_ENV_DASHBOARD = "dashboard"

# Production stack (canonical + readable).
SKYYROSE_PRODUCTION_FRONTEND_URL = "https://app.devskyy.app"
SKYYROSE_PRODUCTION_DASHBOARD_URL = "https://app.devskyy.app"
SKYYROSE_PRODUCTION_API_URL = "https://api.devskyy.app"
SKYYROSE_PRODUCTION_API_BASE_URL = "https://api.devskyy.app"
SKYYROSE_PRODUCTION_API_V1_URL = "https://api.devskyy.app/api/v1"
SKYYROSE_PRODUCTION_API_PREFIX = "/api/v1"
SKYYROSE_PRODUCTION_WS_URL = "wss://api.devskyy.app"
SKYYROSE_PRODUCTION_WORDPRESS_SITE = "https://skyyrose.co"
