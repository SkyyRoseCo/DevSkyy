/* ═════════════ shared primitives (three variants, three skeletons) ═════════════ */

/* Brand marks on black. VERIFIED with PIL this session: skyyrose-monogram.webp,
   skyyrose-rose-icon.webp and tsrc-lockup-static@2x.webp are all mode=RGB with an
   OPAQUE WHITE background (minA=255) — dropped in raw they render as white boxes.
   invert(1) hue-rotate(180deg) is an exact hue-preserving luminance flip: the CSS
   hue-rotate matrix at 180° maps the inverted rose gold (72,145,134) back to
   (185,112,124) — within 2/255 of the source (183,110,121) — while white → pure
   black. mix-blend-mode:screen then drops that black plate into --black entirely.
   The leading contrast(1.08) is there because these plates are 253,253,253 rather
   than pure white; without it the inverted plate lands 2/255 off --black and
   ghosts a faint rectangle. contrast pins it to 255 → invert → pure black.
   PRODUCTION NOTE: ship real alpha-channel PNG/WebP instead of this filter. */
.rcp-mark { filter: contrast(1.08) invert(1) hue-rotate(180deg); mix-blend-mode: screen; }


/* ═══════════════════ A — ASYMMETRIC PROOF MOSAIC ═══════════════════
   One hairline grid. Stats and press are PEER CELLS in the same mosaic — the
   press outlets are not a separate strip, they are a tile of the ledger. The
   33 is a 3×2 monument that anchors the whole block. Scan target: the numeral. */

.rcp-a__inner { max-width: var(--container); margin: 0 auto; }

.rcp-a__top {
  display: flex; align-items: baseline; justify-content: space-between;

  font-family: var(--font-caps); font-size: var(--text-sm);
  letter-spacing: var(--tracking-wider); color: var(--rose-gold);

.rcp-a__grid {
  display: grid; gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  grid-template-columns: repeat(6, 1fr);
  grid-template-areas:
    "n1 n1 n1 n2 n2 mk"
    "n1 n1 n1 n3 n3 mk"

.rcp-a__cell {
  background: var(--black);
  padding: var(--space-8);
  display: flex; flex-direction: column; justify-content: flex-end; gap: var(--space-3);

/* The reveal rides the cell's CONTENTS, never the cell. Fading the cell itself fades its
   background too, and the grid's hairline backing (--border) then floods the whole
   un-revealed tile: MEASURED at 390px, 18.9% of the frame painted flat --border instead of
   black until the observer fired — a grey slab, not a hairline. Keeping the tile opaque and
   moving opacity/translate onto its children holds the mosaic black at every scroll position. */

  opacity: 0; transform: translateY(18px);
  transition: opacity var(--dur-reveal) var(--ease-cinematic),

    var cells = root.querySelectorAll('.rcp-a__cell');
    var nums  = root.querySelectorAll('[data-count]');

    var pad = function (v, n) { var s = String(v); while (s.length < n) s = '0' + s; return s; };

    function countUp(el) {
      var target = parseInt(el.dataset.count, 10);
      var width  = parseInt(el.dataset.pad || '0', 10);
      if (reduce) { el.textContent = pad(target, width); return; }
      var t0 = performance.now();
      (function tick(now) {
        var p = Math.min(1, (now - t0) / 900);
        var e = 1 - Math.pow(1 - p, 3);
        el.textContent = pad(Math.round(target * e), width);
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
    }

    if (!reduce) nums.forEach(function (n) { n.textContent = pad(0, parseInt(n.dataset.pad || '0', 10)); });

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add('is-in');
        var n = en.target.querySelector('[data-count]');
        if (n) countUp(n);
        io.unobserve(en.target);
      });
    }, { threshold: 0.25 });

    cells.forEach(function (c) { io.observe(c); });
  })();
  </script>
</section>
