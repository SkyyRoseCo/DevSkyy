<!--
  THE COLLECTION CHOOSER — throwaway prototype. Three variants that genuinely disagree.

  Replaces the THREE competing choosers currently on front-page.php:
    1. .commercial-runway  (3 photo tiles → collection pages)
    2. .collections        (3 photo cards + Kids Capsule excluded via show_on_front=false)
    3. .style-atelier      (3-button "find your lane" picker → collection pages)
  One section, four collections, one job: pick a world and go.

  ── ROUTES ─────────────────────────────────────────────────────────────────────
  The brief specified /collection-<slug>/. That path is the LEGACY one and 404s —
  it is literally bug-098 in .wolf/buglog.json. The canonical route is
  /collections/<slug>/, per skyyrose_get_collections_config()['page_url']
  (inc/collections-config.php). Canonical wins; flagged so the founder knows.

  ── COPY ───────────────────────────────────────────────────────────────────────
  Every string below is lifted verbatim from the theme. Sources:
    front-page.php            → "The Collections", "Four Collections. One Vision.",
                                "Explore Collection", "{n} Pieces", loader tagline
    inc/collections-config.php → poetic_tagline, label, num, short_desc, description
    front-page.php (kc-heir)  → "Capsule · IV · Heir Apparent"
  GAP: no real string exists for a chooser-level sub-headline, so variants reuse the
  loader/hero tagline "" rather than invent brand voice.

  ── PIECE COUNTS ───────────────────────────────────────────────────────────────
  Hardcoded here from the canonical catalog (wordpress-theme/skyyrose-flagship/data/
  skyyrose-catalog.csv, 33 rows, counted this session):
    black-rose 14 · signature 12 · love-hurts 5 · kids-capsule 2
  In production these come from skyyrose_get_collection_products( $slug ).

  ── ASSETS ─────────────────────────────────────────────────────────────────────
  Every referenced file was ls'd AND pixel-inspected before use:
    assets/branding/black-rose-logo.webp  2048² — 3D crystal-star / black-rose object
                                          render on an OPAQUE BLACK field. Blends into
                                          --black seamlessly. Not a logotype: an object.
    assets/branding/love-hurts-logo.webp  1440² — red enamel PIN badge on an OPAQUE
                                          WHITE field, no alpha. It CANNOT float on
                                          black. Variant C therefore presents it on a
                                          deliberate light backing card — which is what
                                          an enamel pin actually ships on.
    assets/branding/signature-logo.webp   2577×882 — gold "The Skyy Rose Collection"
                                          logotype WITH true alpha. Safe on dark.
                                          GAP: it reads as the HOUSE lockup, not the
                                          word "Signature" — front-page.php maps
                                          signature → sig-brand-skyy-rose-gold, so the
                                          brand already treats it this way, but a
                                          Signature-specific lockup would be better.
    assets/branding/skyy-mascot.webp      1024x1035 — the SkyyRose mascot, and as of the
                                          founder's direction the KIDS CAPSULE MARK. It is
                                          the one collection that had no logo asset; this
                                          fills it. Opaque 255-WHITE field, no alpha, like
                                          the enamel pin — so it gets the SAME call: present
                                          it on the light plate the artwork already ships on.
                                          NEVER invert it. It is a photographic character,
                                          not line art; negating it produces a negative face.
                                          It is also a CHARACTER, not a wordmark, so it
                                          carries no name of its own and locks up WITH
                                          "Kids Capsule" in --script-kc rather than
                                          replacing it.
  Variants A and B use zero raster art on purpose — a chooser that only works when the
  photography lands is not a chooser, it is a lookbook. That holds for ALL FOUR collections,
  so the mascot does not appear in them either: A shows no marks at all and B carries each
  world as an oversized script ghost. Giving Kids Capsule alone a raster mark there would
  recreate the very inconsistency this change removes. Variant C is the only variant that
  shows the physical artifacts, so it is the only one where the mark belongs.
-->

<style>
/* ══════════════════════════════════════════════════════════════════════════════
   SHARED — the only thing all three variants agree on: what a collection IS.
   Each collection carries its accent as a local custom property so a variant
   never hardcodes which world it is drawing.
   ══════════════════════════════════════════════════════════════════════════════ */

.cx {
  background: var(--black);
  color: var(--fg1);
  font-family: var(--font-body);
  padding: var(--space-24) 0 var(--space-32);
  overflow-x: clip;
}

/* Three accent slots per world, because one is not enough to stay legible:
     --acc       structural colour — fills, borders, glows, LARGE display type
     --acc-text  the same identity where the text is SMALL (< 18.66px bold)
     --on-acc    what is legible sitting ON a solid --acc fill
   Measured this session against --black #0A0A0A:
     gold 9.42:1 · silver 10.88:1 · rose-gold 5.20:1 · crimson 3.97:1
   Crimson is the only one that fails small-text AA (needs 4.5). So crimson —
   and only crimson — swaps to --fg2 for small text and keeps its identity as a
   filled marker instead, which is a fill, which is allowed.
   Same measurement drives --on-acc: white on crimson 4.99:1 PASS,
   black on crimson 3.97:1 FAIL. */
[data-collection="signature"]    { --acc: var(--gold);      --acc-rgb: var(--gold-rgb);      --acc-text: var(--gold);      --on-acc: var(--black); }
[data-collection="black-rose"]   { --acc: var(--silver);    --acc-rgb: var(--silver-rgb);    --acc-text: var(--silver);    --on-acc: var(--black); }
[data-collection="love-hurts"]   { --acc: var(--crimson);   --acc-rgb: var(--crimson-rgb);   --acc-text: var(--fg2);       --on-acc: var(--fg1); }
[data-collection="kids-capsule"] { --acc: var(--rose-gold); --acc-rgb: var(--rose-gold-rgb); --acc-text: var(--rose-gold); --on-acc: var(--black); }

.cx-eyebrow {
  font-family: var(--font-accent);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--fg3);
}

.cx-sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* ══════════════════════════════════════════════════════════════════════════════
   VARIANT A — COUNT-LED INDEX
   Organising idea: the chooser is a typeset contents page. Depth is the headline —
   the piece count is the single biggest thing on the screen, so the visitor picks
   by "which world is deepest / which one has enough for me", not by which photo
   they liked. No imagery at all. No cards. Full-bleed hairline rows.
   Typography is deliberately UNIFORM (Archivo + Anton, no scripts) because an
   index is typeset, not calligraphic — identity carries on accent colour alone.
   ══════════════════════════════════════════════════════════════════════════════ */

.cxi-head {
  max-width: var(--container);
  margin: 0 auto var(--space-16);
  padding: 0 var(--space-6);
}
.cxi-title {
  font-family: var(--font-display);
  font-variation-settings: 'wdth' 125;
  font-weight: 800;
  font-size: var(--text-4xl);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  margin-top: var(--space-3);
}
.cxi-sub {
  color: var(--fg3);
  font-size: var(--text-sm);
  letter-spacing: var(--tracking-wide);
  margin-top: var(--space-3);
}

.cxi-list { list-style: none; border-top: 1px solid var(--border); }
.cxi-row  { border-bottom: 1px solid var(--border); }

.cxi-link {
  position: relative;
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr) auto;
  grid-template-areas: 'rank body count' 'rank go go';
  align-items: center;
  gap: 0 var(--space-6);
  max-width: var(--container);
  margin: 0 auto;
  padding: var(--space-8) var(--space-6);
  text-decoration: none;
  isolation: isolate;
}
/* Accent wash sweeps in from the rank column, not from nowhere. */
.cxi-link::before {
  content: '';
  position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, rgba(var(--acc-rgb), .16), rgba(var(--acc-rgb), .04) 42%, transparent 72%);
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--dur-slow) var(--ease-cinematic);
}
.cxi-link:hover::before,
.cxi-link:focus-visible::before { transform: scaleX(1); }
.cxi-link:focus-visible { outline: 2px solid var(--acc); outline-offset: -4px; }

.cxi-rank {
  grid-area: rank;
  font-family: var(--font-accent);
  font-size: var(--text-lg);
  letter-spacing: var(--tracking-wider);
  color: var(--fg3);
  transition: color var(--dur-base) var(--ease);
}
/* --acc-text, not --acc: Anton is declared at font-weight 400, so the WCAG
   "large text" exemption needs 24px, not 18.66px. This is 19px. Crimson would
   fail; every other accent is identical either way. */
.cxi-link:hover .cxi-rank,
.cxi-link:focus-visible .cxi-rank { color: var(--acc-text); }

.cxi-body { grid-area: body; min-width: 0; }
.cxi-name {
  display: block;
  font-family: var(--font-display);
  font-variation-settings: 'wdth' 125;
  font-weight: 700;
  font-size: clamp(1.75rem, 5.2vw, 2.75rem);
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}
.cxi-kicker {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-family: var(--font-accent);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--acc-text);
  margin-bottom: var(--space-2);
}
/* Accent survives as a FILL even where the text colour had to back off. */
.cxi-kicker::before {
  content: ''; flex: 0 0 auto;
  width: 14px; height: 3px; background: var(--acc);
}
.cxi-tag {
  display: block;
  color: var(--fg3);
  font-size: var(--text-sm);
  line-height: var(--leading-snug);
  margin-top: var(--space-2);
  max-width: 46ch;
}

/* The point of the whole variant. */
.cxi-count { grid-area: count; text-align: right; line-height: 1; }
.cxi-count b {
  display: block;
  font-family: var(--font-accent);
  font-weight: 400;
  font-size: clamp(2.5rem, 9vw, 4.5rem);
  color: var(--fg1);
  font-variant-numeric: tabular-nums;
  transition: color var(--dur-base) var(--ease), transform var(--dur-base) var(--ease-magnetic);
}
.cxi-link:hover .cxi-count b,
.cxi-link:focus-visible .cxi-count b { color: var(--acc); transform: translateY(-2px); }
.cxi-count i {
  display: block;
  font-style: normal;
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--fg3);
  margin-top: var(--space-2);
}

.cxi-go {
  grid-area: go;
  justify-self: start;
  margin-top: var(--space-4);
  font-family: var(--font-ui);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--fg2);
  border-bottom: 1px solid rgba(var(--acc-rgb), .55);
  padding-bottom: 3px;
}
.cxi-go span {
  display: inline-block;
  transition: transform var(--dur-base) var(--ease-magnetic);
}
.cxi-link:hover .cxi-go span,
.cxi-link:focus-visible .cxi-go span { transform: translateX(6px); }

.cxi-foot {
  max-width: var(--container);
  margin: var(--space-12) auto 0;
  padding: 0 var(--space-6);
  color: var(--fg3);
  font-size: var(--text-sm);
  letter-spacing: var(--tracking-wide);
}
.cxi-foot b { color: var(--fg1); font-family: var(--font-accent); font-weight: 400; }

@media (max-width: 720px) {
  .cxi-link {
    grid-template-columns: 44px minmax(0, 1fr);
    grid-template-areas: 'rank body' '. count' '. go';
    padding: var(--space-6) var(--space-4);
  }
  .cxi-count { text-align: left; margin-top: var(--space-3); }
  .cxi-count b { font-size: clamp(2.25rem, 12vw, 3rem); }
  .cxi-head { padding: 0 var(--space-4); }
  .cxi-foot { padding: 0 var(--space-4); }
}

/* ══════════════════════════════════════════════════════════════════════════════
   VARIANT B — SWIPE-THROUGH ROOMS
   Organising idea: a corridor, not a list. One collection fills the frame at a
   time and floods it with its own accent; you swipe between worlds. Immersion is
   the hierarchy — the name is set enormous in the collection's OWN script, the
   count demotes to a fact line. Primary affordance is the thumb (>70% mobile),
   with dots and a 01/04 corridor counter as the only chrome.
   ══════════════════════════════════════════════════════════════════════════════ */

.cxr { padding-bottom: var(--space-16); }
.cxr-top {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4);
  max-width: var(--container-wide);
  margin: 0 auto var(--space-8);
  padding: 0 var(--space-6);
}
.cxr-top h2 {
  font-family: var(--font-display);
  font-variation-settings: 'wdth' 125;
  font-weight: 800;
  font-size: var(--text-3xl);
  letter-spacing: var(--tracking-tight);
  margin-top: var(--space-2);
}
.cxr-counter {
  font-family: var(--font-accent);
  font-size: var(--text-xl);
  letter-spacing: var(--tracking-wider);
  color: var(--fg3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.cxr-counter b { color: var(--fg1); font-weight: 400; }

.cxr-rail {
  display: flex;
  gap: var(--space-4);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scroll-padding-inline: 7vw;
  padding: 0 7vw var(--space-6);
  scrollbar-width: none;
}
.cxr-rail::-webkit-scrollbar { display: none; }
.cxr-rail:focus-visible { outline: 2px solid var(--rose-gold); outline-offset: 4px; }

.cxr-room {
  position: relative;
  flex: 0 0 86vw;
  max-width: 620px;
  min-height: 74svh;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: var(--space-3);
  padding: var(--space-8) var(--space-6) var(--space-8);
  border: 1px solid rgba(var(--acc-rgb), .28);
  border-radius: var(--radius-sharp);
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(var(--acc-rgb), .18), transparent 62%),
    linear-gradient(180deg, var(--smoke), var(--black) 70%);
  box-shadow: var(--depth-3);
  overflow: hidden;
  isolation: isolate;
}
/* Ghost of the collection's own script, oversized and clipped by the room —
   texture, not text. aria-hidden in markup. */
.cxr-ghost {
  position: absolute; top: -4%; left: -8%; z-index: 0;
  font-size: clamp(9rem, 34vw, 18rem);
  line-height: .8;
  color: rgba(var(--acc-rgb), .09);
  pointer-events: none;
  white-space: nowrap;
}
.cxr-room > *:not(.cxr-ghost) { position: relative; z-index: 1; }

.cxr-num {
  display: flex; align-items: center; gap: var(--space-3);
  font-family: var(--font-accent);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--acc-text);
}
.cxr-num::before { content: ''; width: 20px; height: 3px; background: var(--acc); flex: 0 0 auto; }
.cxr-name {
  font-size: clamp(3rem, 13vw, 5.5rem);
  line-height: .95;
  font-weight: 400;
  color: var(--fg1);
  /* Identity glow uses the accent as light, never as text colour. */
  text-shadow: 0 0 34px rgba(var(--acc-rgb), .38);
}
[data-collection="signature"]    .cxr-name { font-family: var(--script-sig); }
[data-collection="black-rose"]   .cxr-name { font-family: var(--script-br); }
[data-collection="love-hurts"]   .cxr-name { font-family: var(--script-lh); font-size: clamp(2.5rem, 10vw, 4.25rem); }
[data-collection="kids-capsule"] .cxr-name { font-family: var(--script-kc); }

.cxr-poetic {
  font-family: var(--font-caps);
  font-size: var(--text-lg);
  line-height: var(--leading-snug);
  color: var(--fg2);
  max-width: 24ch;
}
.cxr-desc {
  color: var(--fg3);
  font-size: var(--text-sm);
  line-height: var(--leading-normal);
  max-width: 40ch;
}

.cxr-facts {
  display: flex; gap: var(--space-8);
  margin: var(--space-4) 0 var(--space-2);
  padding-top: var(--space-4);
  border-top: 1px solid rgba(var(--acc-rgb), .3);
}
.cxr-facts dt {
  font-family: var(--font-ui);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--fg3);
}
.cxr-facts dd {
  font-family: var(--font-accent);
  font-size: var(--text-2xl);
  color: var(--fg1);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.cxr-cta {
  align-self: flex-start;
  margin-top: var(--space-4);
  padding: var(--space-4) var(--space-8);
  background: var(--acc);
  color: var(--on-acc);
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: var(--text-sm);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  text-decoration: none;
  border-radius: var(--radius-pill);
  transition: transform var(--dur-base) var(--ease-magnetic), box-shadow var(--dur-base) var(--ease);
}
.cxr-cta:hover, .cxr-cta:focus-visible { transform: translateY(-2px); box-shadow: 0 0 28px rgba(var(--acc-rgb), .45); }
.cxr-cta:focus-visible { outline: 2px solid var(--fg1); outline-offset: 3px; }

.cxr-dots {
  display: flex; justify-content: center; gap: var(--space-3);
  margin-top: var(--space-6);
}
.cxr-dot {
  width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer;
  display: grid; place-items: center;
}
.cxr-dot::after {
  content: ''; width: 26px; height: 2px;
  background: var(--border);
  transition: background var(--dur-base) var(--ease), width var(--dur-base) var(--ease);
}
.cxr-dot[aria-current="true"]::after { background: var(--acc); width: 40px; }
.cxr-dot:focus-visible { outline: 2px solid var(--fg1); outline-offset: -6px; }

.cxr-hint {
  text-align: center; color: var(--fg3);
  font-size: var(--text-xs); letter-spacing: var(--tracking-wider);
  text-transform: uppercase; margin-top: var(--space-4);
}

@media (min-width: 900px) {
  .cxr-room { flex: 0 0 min(52vw, 560px); min-height: 62svh; }
  .cxr-rail { scroll-padding-inline: 10vw; padding-inline: 10vw; }
}
@media (max-width: 480px) {
  .cxr-top { flex-direction: column; align-items: flex-start; gap: var(--space-2); padding: 0 var(--space-4); }
  .cxr-room { flex-basis: 88vw; padding: var(--space-6) var(--space-5); }
  .cxr-facts { gap: var(--space-6); }
}

/* ══════════════════════════════════════════════════════════════════════════════
   VARIANT C — EXPANDING BLADES
   Organising idea: nothing ever leaves the screen. All four worlds stay present
   as spines and exactly one is open — so the choice is a COMPARISON made in
   place, not a journey. Counts sit on every spine simultaneously, which is the
   only layout here where all four depths are legible at once.
   This is also the only variant that shows the real physical artifacts, because
   an expanded blade is the only place with room to do them justice.
   ══════════════════════════════════════════════════════════════════════════════ */

.cxb-head {
  max-width: var(--container-wide);
  margin: 0 auto var(--space-10);
  padding: 0 var(--space-6);
}
.cxb-head h2 {
  font-family: var(--font-display);
  font-variation-settings: 'wdth' 125;
  font-weight: 800;
  font-size: var(--text-4xl);
  letter-spacing: var(--tracking-tight);
  line-height: var(--leading-tight);
  margin-top: var(--space-3);
}

.cxb-set {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-width: var(--container-wide);
  margin: 0 auto;
  padding: 0 var(--space-4);
}

.cxb-blade {
  display: flex;
  flex-direction: column;
  background: var(--charcoal);
  border: 1px solid var(--border);
  border-left: 3px solid rgba(var(--acc-rgb), .45);
  overflow: hidden;
  transition: border-left-color var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
}
.cxb-blade.is-open { border-left-color: var(--acc); background: var(--smoke); }

.cxb-spine {
  display: flex; align-items: center; gap: var(--space-4);
  width: 100%; min-height: 68px;
  padding: var(--space-4) var(--space-5);
  background: none; border: 0; cursor: pointer;
  color: var(--fg1); text-align: left;
  font-family: var(--font-accent);
}
.cxb-spine:focus-visible { outline: 2px solid var(--acc); outline-offset: -3px; }
.cxb-spine-num {
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-widest);
  color: var(--fg3);
  font-variant-numeric: tabular-nums;
}
.cxb-spine-name {
  flex: 1 1 auto;
  font-size: clamp(1.25rem, 5vw, 1.75rem);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  line-height: 1;
}
/* 20px Anton at weight 400 — below the 24px large-text exemption, so this goes
   through --acc-text too. Love Hurts still reads "open" via its crimson border
   and the rotated mark, both of which are fills. */
.cxb-blade.is-open .cxb-spine-name { color: var(--acc-text); }
.cxb-spine-count {
  font-size: var(--text-sm);
  letter-spacing: var(--tracking-wider);
  color: var(--fg3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.cxb-spine-mark {
  width: 18px; height: 18px; flex: 0 0 auto;
  position: relative;
}
.cxb-spine-mark::before,
.cxb-spine-mark::after {
  content: ''; position: absolute; inset: 50% 0 auto;
  height: 1px; background: var(--fg3);
  transition: transform var(--dur-base) var(--ease-whip), background var(--dur-base) var(--ease);
}
.cxb-spine-mark::after { transform: rotate(90deg); }
.cxb-blade.is-open .cxb-spine-mark::before,
.cxb-blade.is-open .cxb-spine-mark::after { background: var(--acc); }
.cxb-blade.is-open .cxb-spine-mark::after { transform: rotate(0deg); }

.cxb-panel { display: none; }
.cxb-blade.is-open .cxb-panel {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-6);
  padding: 0 var(--space-5) var(--space-8);
}

.cxb-art {
  position: relative;
  aspect-ratio: 1 / 1;
  max-width: 260px;
  border-radius: var(--radius-sm);
  overflow: hidden;

   plate, it dissolves into the section background. */
.cxb-art--void { background: var(--black); }
/* love-hurts-logo.webp is an enamel pin on an OPAQUE WHITE field with a soft
   drop shadow and no alpha channel. Rather than fight it with blend modes that
   would wreck the red, it is presented on the backing card an enamel pin
   actually ships on. Deliberate object, not a leaked white box. */
.cxb-art--plate {
  /* Must be pure --fg1, NOT an off-white: the source image's own field is
     (255,255,255), so any tinted plate leaves a visible seam rectangle. */
  background: var(--fg1);
  padding: var(--space-4);
  box-shadow: var(--depth-2), 0 0 0 1px rgba(var(--acc-rgb), .5);
}
/* signature-logo.webp carries true alpha — straight onto the dark. */
.cxb-art--alpha { background: transparent; aspect-ratio: 16 / 7; max-width: 340px; }
.cxb-art--alpha img { object-fit: contain; }
/* Kids Capsule's artifact is the MASCOT — the collection that had no logo asset now carries
   the only character mark in the set. Its field is the same problem as the enamel pin (opaque
   255-white, no alpha) so it gets the same answer: present it on the light plate the artwork
   already ships on. It is NEVER inverted — it is a photographic character, not line art, and
   negating it produces a negative face rather than a silver mark.
   The plate is pure --fg1 for the reason given on --plate. Here the image is held at its own
   1024x1035 ratio, so the plate is never more than a hairline beyond the artwork and cannot
   seam at all.
   aspect-ratio stays released: a character mark plus a Grand Hotel line is content-sized, and
   a locked square with overflow:hidden would clip rather than grow.

   name. That rose-gold sits on --black (5.20:1), not on the white plate, where it would only
   scrape the large-text bar. */

  (function () {
    var rail  = document.querySelector('[data-cxr-rail]');
    var rooms = Array.prototype.slice.call(document.querySelectorAll('[data-cxr-room]'));
    var dots  = Array.prototype.slice.call(document.querySelectorAll('[data-cxr-go]'));
    var now   = document.querySelector('[data-cxr-now]');
    if (!rail || !rooms.length) return;

    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function mark(i) {
      if (now) now.textContent = String(i + 1).padStart(2, '0');
      dots.forEach(function (d, di) { d.setAttribute('aria-current', String(di === i)); });
    }

    // "Current" = the room whose centre is nearest the rail's centre.
    // NOT an IntersectionObserver threshold: at desktop the rooms are 560px in a
    // 1440px rail, so three of them clear any threshold at once and whichever
    // callback fires last wins — measured off-by-one on rooms 1-3. Nearest-centre
    // is single-valued at every viewport, and it is what "snapped" actually means.
    var ticking = 0;
    function sync() {
      var rc = rail.getBoundingClientRect(), mid = rc.left + rc.width / 2;
      var best = 0, bestDist = Infinity;
      rooms.forEach(function (r, i) {
        var b = r.getBoundingClientRect();
        var d = Math.abs(b.left + b.width / 2 - mid);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      // The rail clamps at both ends, so the first and last room can never
      // physically reach the centre on a wide viewport — without this the
      // counter reads 02 while you are sitting at the very start of the
      // corridor. At an extreme, the extreme room IS the current one.
      var max = rail.scrollWidth - rail.clientWidth;
      if (rail.scrollLeft <= 2) best = 0;
      else if (rail.scrollLeft >= max - 2) best = rooms.length - 1;
      mark(best);
    }
    rail.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = requestAnimationFrame(function () { ticking = 0; sync(); });
    }, { passive: true });
    sync();

    function goTo(i) {
      var r = rooms[Math.max(0, Math.min(rooms.length - 1, i))];
      r.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
    }
    dots.forEach(function (d) {
      d.addEventListener('click', function () { goTo(parseInt(d.dataset.cxrGo, 10)); });
    });

    rail.addEventListener('keydown', function (e) {
      var cur = dots.findIndex(function (d) { return d.getAttribute('aria-current') === 'true'; });
      if (e.key === 'ArrowRight') { goTo(cur + 1); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { goTo(cur - 1); e.preventDefault(); }
    });
  })();

    if (!set) return;

    function open(i) {
      spines.forEach(function (s, si) {
        var on = si === i;
        s.setAttribute('aria-expanded', String(on));
        s.closest('.cxb-blade').classList.toggle('is-open', on);
      });
    }

    spines.forEach(function (s, i) {
      s.addEventListener('click', function () { open(i); });
      s.addEventListener('keydown', function (e) {
        var d = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1
              : (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   ? -1 : 0;
        if (!d) return;
        var n = (i + d + spines.length) % spines.length;
        spines[n].focus(); open(n); e.preventDefault();
      });
    });
  })();
  </script>
</template>
