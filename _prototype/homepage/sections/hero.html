<!--
  HERO — three variants. PROTOTYPE, throwaway. Not production, not deployable.

  FIXED ACROSS ALL THREE (founder direction): the 720x1280 PORTRAIT video is centred and
  fully visible. Sizing is width-first — `width: min(<vw cap>, calc(<vh cap> * 9/16))` with
  `aspect-ratio: 9/16` — so the frame can never be cover-cropped at either end. Height-first
  sizing (height:100vh; width:auto) overflows horizontally on phones; it is not used here.

  WHAT VARIES: the relationship between video, marquee, type and CTA.
    A  logo field passes BEHIND the video, through the pillarbox gutters. Button-led.
    B  marquee becomes two discrete BANDS clamping the video; empty pillarbox; type is an
       editorial caption column below. Reading-led (text links).
    C  monumental type sits BEHIND and overlaps the video edges; the marquee crosses at
       mid-height between them AND is the navigation. No conventional CTA.

  ── ASSET FACTS, verified this session with `magick identify` + corner-pixel sampling, then
     eyes-on against a screen-composited simulation. Do not re-derive:
       WHITE background, dark artwork (no alpha) → skyyrose-monogram, skyyrose-rose-icon,
         love-hurts-logo, black-rose-collection-text, tsrc-lockup-static@2x
       BLACK background, light artwork (no alpha) → black-rose-logo  (it is a 3D crystal
         trophy object, NOT a wordmark — used only in B's recognition beat, never the wall)
       REAL ALPHA, gold → signature-logo   (the only ALPHA asset)
       WHITE background, FULL-COLOUR CHARACTER (no alpha) → skyy-mascot  (see below)
     Treatment: white-bg marks get `invert(1) grayscale(1)`; the whole marquee wrapper then
     carries `mix-blend-mode: screen` so the inverted #000 field lands exactly on --black and
     disappears. Result is a silver monochrome logo wall with the gold Signature lockup and the
     plated mascot as its two colour accents — a deliberate call, not a limitation.
     tsrc-lockup-static@2x.webp is only 198x144 → capped at 34px tall or it turns to mush.

  ── KIDS CAPSULE — the gap is now FILLED by the mascot (founder direction). The other three
     collections appear as wordmarks; Kids Capsule appears as its CHARACTER mark, `.hx-kc`.
       skyy-mascot.webp  1024x1035, opaque 255-white field, NO alpha, 36,841 colours.
     It must NEVER take .hx-inv. Simulated and looked at: inverting a photographic character
     turns her skin and hair into a photographic negative — a horror mask, not a silver mark.
     So it is plated, exactly as chooser.html plates the love-hurts enamel pin and for exactly
     the same reason. Here the image's OWN white field is the plate (clipped to a soft rect
     with a rose-gold hairline), so there is no tinted-plate seam to fight.
     A character carries no name, so it locks up WITH "Kids Capsule" in --script-kc rather than
     replacing it: mark + name = the Kids Capsule mark, not a sticker.
     Sized ~65-70% of the mean wordmark height in each track — a dense near-square reads far
     heavier than sparse wide lettering at the same box height.

  ── COPY: every string below is lifted from wordpress-theme/skyyrose-flagship/front-page.php.
     No invented brand voice.
-->
<style>
/* ════════ SHARED — logo-mark treatment only. Everything else is namespaced per variant,
   because index.html clones EVERY <style> in this file into the stage, so all three
   variants' CSS is live at once and any shared class name would have them fight. ════════ */

.hx-lg {
  height: var(--lg-h, 60px);
  width: auto;
  flex: 0 0 auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}
/* White-bg marks: invert flips the field to black and the artwork to light; grayscale kills
   the hue flip that invert introduces. The wrapper's screen blend erases the black field. */
.hx-inv { filter: invert(1) grayscale(1) contrast(1.06); }

   middle — contained it renders ~15px tall. Cover-crop the middle band so the script fills. */

  width: calc(var(--lg-h, 60px) * 2.4);
  object-fit: cover;
  object-position: center;

/* The screen blend does the real work, but a transformed track creates its own stacking
   context on some engines and can isolate the group — leaving a faint near-black rectangle.
   Low wrapper opacity makes that residual delta (#000 vs #0A0A0A ≈ 4%) imperceptible either
   way. Belt and braces, verified by eye rather than by reasoning about the spec. */
