      <svg data-icon="pause" width="13" height="15" viewBox="0 0 13 15" fill="currentColor" aria-hidden="true" hidden><path d="M0 0h4.5v15H0zM8.5 0H13v15H8.5z"/></svg>
      <span data-play-label>Play the film</span>
    </button>
  </div>
</section>

<script>
(function () {
  var root = document.getElementById('ogB');
  if (!root) return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var vid = root.querySelector('video');
  var btn = root.querySelector('[data-play]');
  var iPlay = root.querySelector('[data-icon="play"]');
  var iPause = root.querySelector('[data-icon="pause"]');
  var label = root.querySelector('[data-play-label]');

  if (vid && !vid.querySelector('source')) {
    var s = document.createElement('source');
    s.src = 'assets/home-hero.webm'; s.type = 'video/webm';
    vid.appendChild(s);
  }

  function sync() {
    var playing = !!vid && !vid.paused && !vid.ended;
    // These are SVGElements. `.hidden` is an HTMLElement IDL property, so
    // `iPlay.hidden = true` silently sets a plain JS prop and never reaches the
    // content attribute — the icon stayed on "play" while the label said
    // "Pause the film". Set the attribute directly.
    function show(el, on) { if (on) el.removeAttribute('hidden'); else el.setAttribute('hidden', ''); }
    show(iPlay, !playing);
    show(iPause, playing);
    label.textContent = playing ? 'Pause the film' : 'Play the film';
    btn.setAttribute('aria-pressed', String(playing));
  }
  if (btn && vid) {
    btn.addEventListener('click', function () {
      if (vid.paused) vid.play().catch(function () {}); else vid.pause();
    });
    vid.addEventListener('play', sync);
    vid.addEventListener('pause', sync);
  }
  // Reduced motion: poster only, and the control still works if asked for.
  if (vid && !reduce) vid.play().catch(function () {});
  sync();

  if (reduce) return;
  root.setAttribute('data-anim', 'on');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('is-in');
      io.unobserve(e.target);
    });
  }, { threshold: .1 });
  root.querySelectorAll('.og-rv').forEach(function (el) { io.observe(el); });
})();
</script>
</template>

<script>
(function () {
  var root = document.getElementById('ogC');
  if (!root) return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ledger = document.getElementById('ogC-ledger');
  var fill = document.getElementById('ogC-fill');

  if (reduce) { if (fill) fill.style.height = '100%'; return; }

  root.setAttribute('data-anim', 'on');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('is-in');
      io.unobserve(e.target);
    });
  }, { threshold: .12 });
  root.querySelectorAll('.og-rv').forEach(function (el) { io.observe(el); });

  // Rail fills as the ledger scrolls past. Self-detaching: the harness remounts
  // the section on every switch, so an orphaned listener unhooks itself.
  function tick() {
    if (!document.body.contains(ledger)) {
      removeEventListener('scroll', tick);
      removeEventListener('resize', tick);
      return;
    }
    var r = ledger.getBoundingClientRect();
    var p = (innerHeight * 0.72 - r.top) / (r.height || 1);
    fill.style.height = (Math.max(0, Math.min(1, p)) * 100) + '%';
  }
  addEventListener('scroll', tick, { passive: true });
  addEventListener('resize', tick);
  tick();
})();
</script>
