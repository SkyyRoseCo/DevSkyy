# Synthetic, loopback-only delivery fixture. No response cache or body rewriting.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { model/gltf-binary glb; }
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    keepalive_timeout 65;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    server {
        listen 8080 default_server;
        server_name 127.0.0.1;
        # Docker publishes only 127.0.0.1:18308. Reject other Host authorities too.
        if ($http_host != "127.0.0.1:18308") { return 421; }
        # Reject ambiguous/traversal path encodings before URI normalization can
        # route them outside the public asset location. Query strings are exempt.
        if ($request_uri ~* "^[^?]*(%2e|%2f|%5c|/\.\.(/|\?|$)|\\\\)") { return 400; }
        location ^~ /wp-content/themes/skyyrose-flagship-2/assets/ {
            # Only this public asset directory is mounted, never the PHP theme,
            # WordPress installation, configuration, uploads or repository root.
            alias /srv/v2-assets/;
            disable_symlinks on;
            if ($uri !~ "^/wp-content/themes/skyyrose-flagship-2/assets/([A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+\.(css|js|wasm|glb|png|jpg|jpeg|webp|mp4|webm|woff2)$") { return 404; }
            if ($uri ~ "/\.") { return 404; }
            limit_except GET { deny all; }
            autoindex off;
            # Native static handler owns HEAD, byte ranges/206/416 and MIME.
            # Preserve seeking: do not compress or otherwise transform media.
        }
        location ^~ /wp-includes/js/ {
            # Filtered exact-byte public snapshot: PHP/JSON are not mounted.
            alias /srv/v2-core-js/;
            disable_symlinks on;
            if ($uri !~ "^/wp-includes/js/([A-Za-z0-9_.,-]+/)*[A-Za-z0-9_.,-]+\.(css|js|wasm|png|jpg|jpeg|webp|avif|svg|gif|ico|woff2?|ttf|eot|otf)$") { return 404; }
            if ($uri ~ "/\.") { return 404; }
            limit_except GET { deny all; }
            autoindex off;
        }
        location ^~ /wp-includes/css/ {
            # Filtered exact-byte public snapshot: PHP/JSON are not mounted.
            alias /srv/v2-core-css/;
            disable_symlinks on;
            if ($uri !~ "^/wp-includes/css/([A-Za-z0-9_.,-]+/)*[A-Za-z0-9_.,-]+\.(css|js|wasm|png|jpg|jpeg|webp|avif|svg|gif|ico|woff2?|ttf|eot|otf)$") { return 404; }
            if ($uri ~ "/\.") { return 404; }
            limit_except GET { deny all; }
            autoindex off;
        }
        location ^~ /wp-includes/fonts/ {
            # Filtered exact-byte public snapshot: PHP/JSON are not mounted.
            alias /srv/v2-core-fonts/;
            disable_symlinks on;
            if ($uri !~ "^/wp-includes/fonts/([A-Za-z0-9_.,-]+/)*[A-Za-z0-9_.,-]+\.(css|js|wasm|png|jpg|jpeg|webp|avif|svg|gif|ico|woff2?|ttf|eot|otf)$") { return 404; }
            if ($uri ~ "/\.") { return 404; }
            limit_except GET { deny all; }
            autoindex off;
        }
        location ^~ /wp-content/plugins/woocommerce/assets/ {
            # Filtered exact-byte public snapshot: PHP/JSON are not mounted.
            alias /srv/v2-woo-assets/;
            disable_symlinks on;
            if ($uri !~ "^/wp-content/plugins/woocommerce/assets/([A-Za-z0-9_.,-]+/)*[A-Za-z0-9_.,-]+\.(css|js|wasm|png|jpg|jpeg|webp|avif|svg|gif|ico|woff2?|ttf|eot|otf)$") { return 404; }
            if ($uri ~ "/\.") { return 404; }
            limit_except GET { deny all; }
            autoindex off;
        }
        location / {
            proxy_pass http://v2-php-origin:18309;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:18308";
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Forwarded-Proto "http";
            proxy_set_header X-Forwarded-Host "127.0.0.1:18308";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_cache off;
            proxy_store off;
            proxy_intercept_errors off;
            proxy_redirect off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
