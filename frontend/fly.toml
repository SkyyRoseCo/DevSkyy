# Run from frontend/: flyctl deploy --config fly.toml --ha=false
# App creation, secrets, and DNS cutover require the reviewed release approval.
app = 'devskyy-dashboard'
primary_region = 'sjc'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
dockerfile = 'Dockerfile'
[build.args]
NEXT_PUBLIC_SITE_URL = 'https://www.devskyy.app'
NEXT_PUBLIC_API_URL = 'https://api.devskyy.app'
NEXT_PUBLIC_WS_URL = 'wss://api.devskyy.app'

[env]
NODE_ENV = 'production'
PORT = '3000'
HOSTNAME = '0.0.0.0'
NEXTAUTH_URL = 'https://www.devskyy.app'
NEXT_PUBLIC_SITE_URL = 'https://www.devskyy.app'
NEXT_PUBLIC_API_URL = 'https://api.devskyy.app'
NEXT_PUBLIC_WS_URL = 'wss://api.devskyy.app'
MCP_URL = 'https://api.devskyy.app/mcp/'
SETTINGS_FILE = '/data/settings.json'

# One machine and one region: local volume is not a shared multi-region store.
# Provision and assign ownership to uid 1000 before testing settings saves.
[[mounts]]
source = 'dashboard_state'
destination = '/data'
initial_size = '1gb'
snapshot_retention = 5

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
[http_service.concurrency]
type = 'requests'
soft_limit = 30
hard_limit = 50
[[http_service.checks]]
grace_period = '30s'
interval = '15s'
timeout = '5s'
method = 'GET'
path = '/healthz'

[[vm]]
cpu_kind = 'shared'
cpus = 1
memory = '1gb'
